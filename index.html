<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="物理ドリル">
<meta name="theme-color" content="#0d0f1a">
<title>物理ドリル 期末対策</title>
<style>
:root {
  --bg:#0d0f1a; --surface:#141728; --surface2:#1e2340;
  --text:#e8eaf6; --text2:#7880a0;
  --radius:14px;
  --correct:#69c46d; --wrong:#e05c5c; --combo:#ffd54f;
  --phy:#7c83ff; --phy-dark:#0d0f2a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
html,body{height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;}
body{
  font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif;
  background:var(--bg);color:var(--text);
  -webkit-text-size-adjust:100%;
  position:fixed;width:100%;
}
.screen{display:none;flex-direction:column;position:absolute;inset:0;overflow:hidden;}
.screen.active{display:flex;}
#top,#home,#result{overflow-y:auto;-webkit-overflow-scrolling:touch;}

/* ===== TOP ===== */
#top{
  align-items:center;
  padding:calc(40px + env(safe-area-inset-top)) 20px calc(32px + env(safe-area-inset-bottom));
  gap:16px;
}
.app-logo{font-size:60px;text-align:center;}
.app-title{font-size:26px;font-weight:800;text-align:center;letter-spacing:.05em;}
.app-title span{background:linear-gradient(90deg,#7c83ff,#a78bfa,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.exam-badge{background:var(--surface2);border:1.5px solid var(--phy);border-radius:12px;padding:10px 20px;font-size:13px;color:var(--phy);font-weight:700;}
.unit-cards{display:flex;flex-direction:column;gap:12px;width:100%;max-width:380px;}
.unit-card{
  background:var(--surface);border:none;border-radius:var(--radius);
  padding:18px 20px;display:flex;align-items:center;gap:14px;
  cursor:pointer;text-align:left;-webkit-appearance:none;
  border-left:4px solid var(--phy);
}
.unit-card-icon{font-size:28px;flex-shrink:0;}
.unit-card-info{flex:1;}
.unit-card-name{font-size:16px;font-weight:700;color:var(--text);}
.unit-card-sub{font-size:11px;color:var(--text2);margin-top:3px;}
.unit-card-count{font-size:11px;color:var(--phy);margin-top:4px;font-weight:700;}
.unit-card-arrow{font-size:20px;color:var(--phy);}
.all-btn{
  background:linear-gradient(135deg,var(--phy),#a78bfa);
  border:none;border-radius:var(--radius);
  padding:16px 24px;width:100%;max-width:380px;
  font-size:16px;font-weight:800;color:#fff;
  cursor:pointer;-webkit-appearance:none;
}

/* ===== HOME (unit detail) ===== */
#home{padding:calc(16px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));gap:12px;align-items:center;}
.back-btn{align-self:flex-start;background:none;border:none;color:var(--phy);font-size:16px;font-weight:700;padding:4px 0;cursor:pointer;-webkit-appearance:none;}
.home-title{font-size:22px;font-weight:800;text-align:center;}
.home-sub{font-size:12px;color:var(--text2);text-align:center;}
.level-cards{display:flex;flex-direction:column;gap:10px;width:100%;max-width:380px;margin-top:8px;}
.level-card{
  background:var(--surface);border:none;border-radius:var(--radius);
  padding:16px 20px;display:flex;align-items:center;gap:12px;
  cursor:pointer;text-align:left;-webkit-appearance:none;
}
.level-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
.level-dot.basic{background:#69c46d;}
.level-dot.standard{background:#7c83ff;}
.level-dot.advanced{background:#ffd54f;}
.level-dot.all{background:linear-gradient(135deg,var(--phy),#a78bfa);}
.level-info{flex:1;}
.level-name{font-size:15px;font-weight:700;}
.level-sub{font-size:11px;color:var(--text2);margin-top:2px;}
.level-arrow{font-size:18px;color:var(--text2);}
.stats-row{display:flex;gap:16px;width:100%;max-width:380px;}
.stat-box{flex:1;background:var(--surface);border-radius:12px;padding:12px;text-align:center;}
.stat-val{font-size:22px;font-weight:800;color:var(--phy);}
.stat-label{font-size:10px;color:var(--text2);margin-top:2px;}

/* ===== QUIZ ===== */
#quiz{background:var(--bg);}
.quiz-header{
  display:flex;align-items:center;gap:10px;
  padding:calc(12px + env(safe-area-inset-top)) 16px 10px;
  flex-shrink:0;
}
.quiz-back{background:none;border:none;font-size:20px;font-weight:700;cursor:pointer;-webkit-appearance:none;color:var(--phy);padding:4px 8px;}
.progress-wrap{flex:1;}
.progress-text{font-size:11px;color:var(--text2);margin-bottom:4px;}
.progress-bar{height:4px;background:var(--surface2);border-radius:2px;overflow:hidden;}
.progress-fill{height:100%;background:var(--phy);border-radius:2px;transition:width .3s;}
.score-badge{font-size:14px;font-weight:800;color:var(--phy);}
.timer-bar-wrap{height:3px;background:var(--surface2);flex-shrink:0;}
.timer-bar-fill{height:100%;background:var(--phy);transition:width .1s linear;}
.combo-banner{text-align:center;font-size:13px;font-weight:800;color:var(--combo);min-height:20px;flex-shrink:0;padding:0 16px;}
.quiz-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px calc(20px + env(safe-area-inset-bottom));}
.question-card{background:var(--surface);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.question-level{font-size:11px;font-weight:700;margin-bottom:8px;}
.question-text{font-size:15px;line-height:1.6;font-weight:600;-webkit-user-select:text;user-select:text;}
.choices{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
.choice-btn{
  background:var(--surface);border:1.5px solid var(--surface2);
  border-radius:12px;padding:14px 16px;
  font-size:14px;line-height:1.4;text-align:left;
  cursor:pointer;-webkit-appearance:none;color:var(--text);
  font-family:inherit;transition:background .1s;
  -webkit-user-select:text;user-select:text;
}
.choice-btn.correct{background:#0d2018;border-color:var(--correct);color:var(--correct);}
.choice-btn.wrong{background:#200d0d;border-color:var(--wrong);color:var(--wrong);}
.choice-btn:disabled{cursor:default;}
.retry-msg{text-align:center;color:var(--wrong);font-size:13px;font-weight:700;min-height:20px;margin-bottom:4px;}
.explanation-card{
  background:var(--surface2);border-radius:12px;padding:14px;
  display:none;margin-bottom:12px;
}
.explanation-card.show{display:block;}
.exp-label{font-size:10px;font-weight:800;color:var(--phy);letter-spacing:.1em;margin-bottom:6px;}
.exp-text{font-size:13px;line-height:1.6;color:var(--text);-webkit-user-select:text;user-select:text;}
.next-btn{
  background:var(--phy);border:none;border-radius:var(--radius);
  padding:16px;width:100%;font-size:15px;font-weight:800;
  color:#fff;cursor:pointer;-webkit-appearance:none;
  display:none;font-family:inherit;
}
.next-btn.show{display:block;}

/* ===== RESULT ===== */
#result{align-items:center;padding:calc(32px + env(safe-area-inset-top)) 20px calc(32px + env(safe-area-inset-bottom));gap:16px;}
.result-icon{font-size:64px;}
.result-title{font-size:24px;font-weight:800;}
.result-score{font-size:48px;font-weight:900;color:var(--phy);}
.result-sub{font-size:13px;color:var(--text2);}
.result-cards{display:flex;gap:12px;width:100%;max-width:380px;}
.result-card{flex:1;background:var(--surface);border-radius:12px;padding:14px;text-align:center;}
.result-card-val{font-size:22px;font-weight:800;color:var(--phy);}
.result-card-label{font-size:10px;color:var(--text2);margin-top:2px;}
.result-btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:380px;}
.btn-primary{background:var(--phy);border:none;border-radius:var(--radius);padding:16px;font-size:15px;font-weight:800;color:#fff;cursor:pointer;-webkit-appearance:none;}
.btn-secondary{background:var(--surface);border:none;border-radius:var(--radius);padding:16px;font-size:15px;font-weight:700;color:var(--text);cursor:pointer;-webkit-appearance:none;}

/* ===== WEAK (苦手克服) ===== */
.weak-btn{
  background:linear-gradient(135deg,#1a0a0a,#2a1010);
  border:1.5px solid var(--wrong);border-radius:var(--radius);
  padding:14px 16px;
  display:none;align-items:center;gap:12px;
  cursor:pointer;text-align:left;width:100%;max-width:380px;-webkit-appearance:none;
  font-family:inherit;
}
.weak-btn.visible{display:flex;}
.weak-btn-icon{font-size:24px;flex-shrink:0;}
.weak-btn-info{flex:1;}
.weak-btn-title{font-size:15px;font-weight:800;color:var(--wrong);}
.weak-btn-sub{font-size:11px;color:var(--text2);margin-top:3px;}
.weak-btn-count{font-size:11px;color:var(--wrong);margin-top:3px;font-weight:700;}
.weak-btn-arrow{font-size:20px;color:var(--wrong);}

/* ===== QUIT MODAL ===== */
.quit-overlay{display:none;position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);align-items:center;justify-content:center;}
.quit-overlay.active{display:flex;}
.quit-modal{background:var(--surface2);border-radius:20px;padding:28px 24px 20px;width:calc(100% - 48px);max-width:320px;text-align:center;}
.quit-modal-title{font-size:17px;font-weight:700;margin-bottom:8px;}
.quit-modal-sub{font-size:13px;color:var(--text2);margin-bottom:24px;}
.quit-modal-btns{display:flex;flex-direction:column;gap:10px;}
.quit-modal-btns button{border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;-webkit-appearance:none;}
.quit-yes{background:var(--wrong);color:#fff;}
.quit-no{background:var(--surface);color:var(--text);}
</style>
</head>
<body>

<!-- TOP: 単元選択 -->
<div id="top" class="screen active">
  <div class="app-logo">⚡</div>
  <div class="app-title"><span>物理ドリル</span></div>
  <div class="exam-badge">📅 期末テスト対策 12/9(水)</div>
  <div class="unit-cards">
    <button class="unit-card" onclick="selectUnit('sound')">
      <span class="unit-card-icon">🔊</span>
      <div class="unit-card-info">
        <div class="unit-card-name">音の性質</div>
        <div class="unit-card-sub">音の伝わり方・振幅と振動数・波形</div>
        <div class="unit-card-count" id="count-sound"></div>
      </div>
      <span class="unit-card-arrow">›</span>
    </button>
    <button class="unit-card" onclick="selectUnit('force')">
      <span class="unit-card-icon">💪</span>
      <div class="unit-card-info">
        <div class="unit-card-name">力のはたらき</div>
        <div class="unit-card-sub">力の種類・フックの法則・力のつり合い</div>
        <div class="unit-card-count" id="count-force"></div>
      </div>
      <span class="unit-card-arrow">›</span>
    </button>
    <button class="unit-card" onclick="selectUnit('wave')">
      <span class="unit-card-icon">〜</span>
      <div class="unit-card-info">
        <div class="unit-card-name">波の性質・発展</div>
        <div class="unit-card-sub">反射・屈折・回折・弦の振動・ドップラー</div>
        <div class="unit-card-count" id="count-wave"></div>
      </div>
      <span class="unit-card-arrow">›</span>
    </button>
  </div>
  <button class="all-btn" onclick="selectUnit('all')">⚡ 全問シャッフル</button>
  <button class="weak-btn" id="top-weak-btn" onclick="startWeak()">
    <span class="weak-btn-icon">🔥</span>
    <div class="weak-btn-info">
      <div class="weak-btn-title">苦手克服モード</div>
      <div class="weak-btn-sub">間違えた問題を集中特訓</div>
      <div class="weak-btn-count" id="top-weak-count"></div>
    </div>
    <span class="weak-btn-arrow">›</span>
  </button>
</div>

<!-- HOME: レベル選択 -->
<div id="home" class="screen">
  <button class="back-btn" onclick="showTop()">‹ 単元選択</button>
  <div class="app-logo" id="home-icon"></div>
  <div class="home-title" id="home-title"></div>
  <div class="home-sub" id="home-sub"></div>
  <div class="stats-row">
    <div class="stat-box"><div class="stat-val" id="h-correct">0</div><div class="stat-label">正解数</div></div>
    <div class="stat-box"><div class="stat-val" id="h-total">0</div><div class="stat-label">挑戦数</div></div>
    <div class="stat-box"><div class="stat-val" id="h-rate">-</div><div class="stat-label">正答率</div></div>
  </div>
  <div class="level-cards">
    <button class="level-card" onclick="startQuiz('BASIC')">
      <div class="level-dot basic"></div>
      <div class="level-info"><div class="level-name">🟢 BASIC</div><div class="level-sub">基本問題</div></div>
      <span class="level-arrow">›</span>
    </button>
    <button class="level-card" onclick="startQuiz('STANDARD')">
      <div class="level-dot standard"></div>
      <div class="level-info"><div class="level-name">🔵 STANDARD</div><div class="level-sub">練習問題・STEP演習</div></div>
      <span class="level-arrow">›</span>
    </button>
    <button class="level-card" onclick="startQuiz('ADVANCED')">
      <div class="level-dot advanced"></div>
      <div class="level-info"><div class="level-name">🟡 ADVANCED</div><div class="level-sub">活用問題・高校へのアクセス</div></div>
      <span class="level-arrow">›</span>
    </button>
    <button class="level-card" onclick="startQuiz('ALL')">
      <div class="level-dot all"></div>
      <div class="level-info"><div class="level-name">⚡ 全レベル</div><div class="level-sub">全問シャッフル</div></div>
      <span class="level-arrow">›</span>
    </button>
  </div>
  <button class="weak-btn" id="weak-btn" onclick="startWeak()">
    <span class="weak-btn-icon">🔥</span>
    <div class="weak-btn-info">
      <div class="weak-btn-title">苦手克服モード</div>
      <div class="weak-btn-sub">間違えた問題を集中特訓</div>
      <div class="weak-btn-count" id="weak-count"></div>
    </div>
    <span class="weak-btn-arrow">›</span>
  </button>
</div>

<!-- QUIZ -->
<div id="quiz" class="screen">
  <div class="quiz-header">
    <button class="quiz-back" onclick="confirmQuit()">✕</button>
    <div class="progress-wrap">
      <div class="progress-text" id="progress-text"></div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    </div>
    <div class="score-badge" id="score-badge">0pt</div>
  </div>
  <div class="timer-bar-wrap"><div class="timer-bar-fill" id="timer-bar" style="width:100%"></div></div>
  <div class="combo-banner" id="combo-banner"></div>
  <div class="quiz-body">
    <div class="question-card">
      <div class="question-level" id="q-level"></div>
      <div class="question-text" id="q-text"></div>
    </div>
    <div class="choices" id="choices"></div>
    <div class="retry-msg" id="retry-msg"></div>
    <div class="explanation-card" id="explanation-card">
      <div class="exp-label">EXPLANATION</div>
      <div class="exp-text" id="exp-text"></div>
    </div>
    <button class="next-btn" id="next-btn" onclick="nextQ()">次の問題 →</button>
  </div>
</div>

<!-- RESULT -->
<div id="result" class="screen">
  <div class="result-icon" id="result-icon"></div>
  <div class="result-title" id="result-title"></div>
  <div class="result-score" id="result-score"></div>
  <div class="result-sub" id="result-sub"></div>
  <div class="result-cards">
    <div class="result-card"><div class="result-card-val" id="r-correct"></div><div class="result-card-label">正解</div></div>
    <div class="result-card"><div class="result-card-val" id="r-wrong"></div><div class="result-card-label">不正解</div></div>
    <div class="result-card"><div class="result-card-val" id="r-rate"></div><div class="result-card-label">正答率</div></div>
  </div>
  <div class="result-btns">
    <button class="btn-primary" onclick="retryQuiz()">もう一度</button>
    <button class="btn-secondary" id="result-weak-btn" onclick="startWeak()" style="display:none;background:#2a1010;color:var(--wrong);border:1.5px solid var(--wrong);">🔥 間違えた問題を特訓</button>
    <button class="btn-secondary" onclick="showTop()">単元選択へ戻る</button>
  </div>
</div>

<!-- QUIT MODAL -->
<div class="quit-overlay" id="quit-overlay">
  <div class="quit-modal">
    <div class="quit-modal-title">クイズを終了しますか？</div>
    <div class="quit-modal-sub">進捗は保存されます</div>
    <div class="quit-modal-btns">
      <button class="quit-yes" onclick="doQuit()">終了する</button>
      <button class="quit-no" onclick="cancelQuit()">続ける</button>
    </div>
  </div>
</div>

<script>
// ===== 問題データ =====

const Q = {
// ===== 音の性質 BASIC (P22-24基本問題) =====
sound_basic: [
  {id:'sb01',q:'音を出している物体はどのような状態にあるか。',choices:['静止している','振動している','加速している','回転している'],ans:1,exp:'音は物体の振動によって発生する。音さや弦をはじくと振動して音が出る。'},
  {id:'sb02',q:'振動して音を発生する物体を何というか。',choices:['振動体','音源（発音体）','共鳴体','反射体'],ans:1,exp:'音源（発音体）は振動して音を発生する物体。音さ、弦、声帯など。'},
  {id:'sb03',q:'振動が次々に伝わる現象を何というか。',choices:['振動','波','音','共鳴'],ans:1,exp:'波は振動が次々に伝わる現象。音は空気中を波として伝わる。'},
  {id:'sb04',q:'音が空気中を伝わるとき、空気はどうなっているか。',choices:['空気自体が移動する','空気が振動している','空気が消える','空気が圧縮されたままになる'],ans:1,exp:'音が空気中を伝わるとき、空気そのものは移動せず、振動が伝わっていく。'},
  {id:'sb05',q:'音は真空中を伝わるか。',choices:['伝わる','伝わらない','条件による','光より速く伝わる'],ans:1,exp:'波を伝えるものがない真空中では、音は伝わらない。'},
  {id:'sb06',q:'音は水中や金属中を伝わるか。',choices:['伝わらない','伝わる','液体のみ伝わる','固体のみ伝わる'],ans:1,exp:'音は気体だけでなく、水などの液体、金属などの固体も伝わる。'},
  {id:'sb07',q:'音が空気中を伝わる速さは、1秒間に約何mか。',choices:['約34m','約340m','約3400m','約34000m'],ans:1,exp:'音の空気中での速さは約340m/s。水中では約1500m/s。'},
  {id:'sb08',q:'音と光の速さを比べたとき、速いのはどちらか。',choices:['音','光','同じ','条件による'],ans:1,exp:'光の速さは約30万km/sで、音（約340m/s）より圧倒的に速い。だから雷は光が先に見える。'},
  {id:'sb09',q:'音の速さを求める式として正しいのはどれか。',choices:['音の速さ=音源までの距離÷音が伝わる時間','音の速さ=音が伝わる時間÷音源までの距離','音の速さ=距離×時間','音の速さ=距離+時間'],ans:0,exp:'音の速さ[m/s]=音源までの距離[m]÷音が伝わる時間[s]'},
  {id:'sb10',q:'音源の振動の振れ幅を何というか。',choices:['振動数','振幅','周期','波長'],ans:1,exp:'振幅は音源の振動の振れ幅。振幅が大きいほど音は大きい。'},
  {id:'sb11',q:'音源が1秒間に振動する回数を何というか。',choices:['振幅','振動数','周期','波長'],ans:1,exp:'振動数は1秒間に振動する回数。単位はヘルツ(Hz)。振動数が多いほど音は高い。'},
  {id:'sb12',q:'振動数の単位であるHzは何と読むか。',choices:['ハーツ','ヘルツ','ホルツ','ヘリウム'],ans:1,exp:'Hz（ヘルツ）は振動数の単位。1Hzは1秒間に1回振動することを表す。'},
  {id:'sb13',q:'弦をはじく強さを変えると、弦の振幅と振動数のどちらが変わるか。',choices:['振動数','振幅','両方','どちらも変わらない'],ans:1,exp:'弦をはじく強さ（振幅）を変えると音の大きさが変わる。強くはじくほど振幅が大きく音が大きい。'},

// ===== 状態管理 =====
let currentUnit = '';
let currentLevel = '';
let quizQueue = [];
let quizIdx = 0;
let sessionPts = 0;
let sessionCorrect = 0;
let combo = 0;
let answered = false;
let firstMiss = false;
let lastUnit = '';
let lastLevel = '';
let isWeakMode = false;

// 苦手問題管理
function loadWeak() {
  try { return JSON.parse(localStorage.getItem('butsuri_weak')||'[]'); } catch(e){ return []; }
}
function saveWeak(arr) {
  try { localStorage.setItem('butsuri_weak', JSON.stringify(arr)); } catch(e){}
}
function addWeak(id) {
  const w = loadWeak();
  if(!w.includes(id)) { w.push(id); saveWeak(w); }
}
function removeWeak(id) {
  const w = loadWeak().filter(x=>x!==id);
  saveWeak(w);
}

// localStorage
function loadStats() {
  try { return JSON.parse(localStorage.getItem('butsuri_stats')||'{}'); } catch(e){ return {}; }
}
function saveStats(d) {
  try { localStorage.setItem('butsuri_stats', JSON.stringify(d)); } catch(e){}
}

// ===== 画面切替 =====
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showTop() {
  updateTopCounts();
  showScreen('top');
}

function updateTopCounts() {
  const units = {sound:'sound', force:'force', wave:'wave'};
  for(const [key, prefix] of Object.entries(units)) {
    const all = getQsByUnit(key, 'ALL');
    document.getElementById('count-'+key).textContent = `全${all.length}問`;
  }
}

// ===== 単元選択 =====
function selectUnit(unit) {
  currentUnit = unit;
  if(unit === 'all') {
    startQuiz('ALL');
    return;
  }
  const names = {sound:'🔊 音の性質', force:'💪 力のはたらき', wave:'〜 波の性質・発展'};
  const subs = {sound:'音の伝わり方・振動数・波形', force:'力の種類・フックの法則・力のつり合い', wave:'反射・屈折・弦の振動・ドップラー効果'};
  const icons = {sound:'🔊', force:'💪', wave:'〜'};
  document.getElementById('home-icon').textContent = icons[unit];
  document.getElementById('home-title').textContent = names[unit];
  document.getElementById('home-sub').textContent = subs[unit];

  const stats = loadStats();
  const key = unit;
  const c = (stats[key]||{}).correct||0;
  const t = (stats[key]||{}).total||0;
  document.getElementById('h-correct').textContent = c;
  document.getElementById('h-total').textContent = t;
  document.getElementById('h-rate').textContent = t>0 ? Math.round(c/t*100)+'%' : '-';

  // 苦手ボタン表示
  updateWeakBtn(unit);
  showScreen('home');
}

function updateWeakBtn(unit) {
  const weak = loadWeak();
  const unitQs = getQsByUnit(unit, 'ALL');
  const unitWeakIds = unitQs.filter(q=>weak.includes(q.id));
  const btn = document.getElementById('weak-btn');
  const cnt = document.getElementById('weak-count');
  if(unitWeakIds.length > 0) {
    btn.classList.add('visible');
    cnt.textContent = `${unitWeakIds.length}問 蓄積中`;
  } else {
    btn.classList.remove('visible');
  }
}

function startWeak() {
  const weak = loadWeak();
  if(weak.length === 0) { alert('苦手問題がまだありません！まずドリルに挑戦してみよう'); return; }
  const allQs = getAllQs();
  const weakQs = allQs.filter(q => weak.includes(q.id));
  if(weakQs.length === 0) { alert('この単元の苦手問題がありません'); return; }
  isWeakMode = true;
  quizQueue = shuffle(weakQs);
  quizIdx = 0; sessionPts = 0; sessionCorrect = 0; combo = 0;
  showScreen('quiz');
  renderQuestion();
}

// ===== 問題取得 =====
function getQsByUnit(unit, level) {
  if(unit === 'all') {
    return getAllQs().filter(q => level==='ALL' || q.level===level);
  }
  const map = {
    sound: { BASIC: Q.sound_basic, STANDARD: Q.sound_standard, ADVANCED: Q.sound_advanced },
    force: { BASIC: Q.force_basic, STANDARD: Q.force_standard, ADVANCED: Q.force_advanced },
    wave:  { BASIC: Q.wave_basic,  STANDARD: Q.wave_standard,  ADVANCED: Q.wave_advanced }
  };
  if(level === 'ALL') {
    return [...(map[unit].BASIC||[]).map(q=>({...q,level:'BASIC'})),
            ...(map[unit].STANDARD||[]).map(q=>({...q,level:'STANDARD'})),
            ...(map[unit].ADVANCED||[]).map(q=>({...q,level:'ADVANCED'}))];
  }
  return (map[unit][level]||[]).map(q=>({...q,level}));
}

function getAllQs() {
  return [
    ...Q.sound_basic.map(q=>({...q,level:'BASIC',unit:'sound'})),
    ...Q.sound_standard.map(q=>({...q,level:'STANDARD',unit:'sound'})),
    ...Q.sound_advanced.map(q=>({...q,level:'ADVANCED',unit:'sound'})),
    ...Q.force_basic.map(q=>({...q,level:'BASIC',unit:'force'})),
    ...Q.force_standard.map(q=>({...q,level:'STANDARD',unit:'force'})),
    ...Q.force_advanced.map(q=>({...q,level:'ADVANCED',unit:'force'})),
    ...Q.wave_basic.map(q=>({...q,level:'BASIC',unit:'wave'})),
    ...Q.wave_standard.map(q=>({...q,level:'STANDARD',unit:'wave'})),
    ...Q.wave_advanced.map(q=>({...q,level:'ADVANCED',unit:'wave'})),
  ];
}

function shuffle(arr) {
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

// ===== クイズ開始 =====
function startQuiz(level) {
  isWeakMode = false;
  currentLevel = level;
  lastUnit = currentUnit;
  lastLevel = level;
  if(currentUnit === 'all') {
    quizQueue = shuffle(getAllQs());
  } else {
    quizQueue = shuffle(getQsByUnit(currentUnit, level));
  }
  if(quizQueue.length === 0) { alert('問題が見つかりません'); return; }
  quizIdx = 0; sessionPts = 0; sessionCorrect = 0; combo = 0;
  showScreen('quiz');
  renderQuestion();
}

// ===== 問題表示 =====
function renderQuestion() {
  if(quizIdx >= quizQueue.length) { endQuiz(); return; }
  answered = false;
  firstMiss = false;
  const q = quizQueue[quizIdx];

  document.getElementById('progress-text').textContent = `${quizIdx+1} / ${quizQueue.length}`;
  document.getElementById('progress-fill').style.width = `${(quizIdx/quizQueue.length)*100}%`;
  document.getElementById('score-badge').textContent = sessionPts+'pt';
  document.getElementById('timer-bar').style.width = '100%';
  document.getElementById('combo-banner').textContent = combo>=3 ? `🔥 ${combo}コンボ！` : '';

  const lvMap = {BASIC:'🟢 BASIC', STANDARD:'🔵 STANDARD', ADVANCED:'🟡 ADVANCED'};
  document.getElementById('q-level').textContent = lvMap[q.level]||'';
  document.getElementById('q-text').textContent = q.q;

  // 選択肢シャッフル
  const idxArr = q.choices.map((_,i)=>i);
  for(let i=idxArr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [idxArr[i],idxArr[j]]=[idxArr[j],idxArr[i]];
  }
  q._shuffledAns = idxArr.indexOf(q.ans);
  let cHtml = '';
  idxArr.forEach((orig,disp)=>{
    cHtml += `<button class="choice-btn" onclick="answer(${disp})">${q.choices[orig]}</button>`;
  });
  document.getElementById('choices').innerHTML = cHtml;
  document.getElementById('retry-msg').textContent = '';
  document.getElementById('explanation-card').classList.remove('show');
  document.getElementById('next-btn').classList.remove('show');
}

// ===== 回答 =====
function answer(idx) {
  if(answered) return;
  const q = quizQueue[quizIdx];
  const btns = document.querySelectorAll('.choice-btn');
  if(idx === q._shuffledAns) {
    answered = true;
    btns[idx].classList.add('correct');
    btns.forEach(b=>b.disabled=true);
    if(!firstMiss) {
      const pts = q.level==='BASIC'?1 : q.level==='STANDARD'?2 : 3;
      sessionPts += pts;
      sessionCorrect++;
      combo++;
      // 苦手リストから除外（1発正解）
      removeWeak(q.id);
    }
    document.getElementById('exp-text').textContent = q.exp;
    document.getElementById('explanation-card').classList.add('show');
    document.getElementById('next-btn').classList.add('show');
    document.getElementById('retry-msg').textContent = '';
    // 統計保存
    if(!firstMiss) {
      const stats = loadStats();
      const key = q.unit || currentUnit;
      if(!stats[key]) stats[key]={correct:0,total:0};
      stats[key].correct++;
      stats[key].total++;
      saveStats(stats);
    }
  } else {
    if(!firstMiss) {
      // 初回ミス：苦手リストに追加
      addWeak(q.id);
      const stats = loadStats();
      const key = q.unit || currentUnit;
      if(!stats[key]) stats[key]={correct:0,total:0};
      stats[key].total++;
      saveStats(stats);
    }
    firstMiss = true;
    combo = 0;
    btns[idx].classList.add('wrong');
    document.getElementById('retry-msg').textContent = '❌ もう一度！';
    answered = true;
    setTimeout(()=>{
      btns[idx].classList.remove('wrong');
      btns[idx].disabled = true;
      answered = false;
    }, 600);
  }
}

function nextQ() {
  quizIdx++;
  renderQuestion();
}

// ===== 終了 =====
function endQuiz() {
  const total = quizQueue.length;
  const rate = Math.round(sessionCorrect/total*100);
  const icons = rate>=80?'🎉':rate>=60?'😊':'💪';
  const titles = rate>=80?'素晴らしい！':rate>=60?'よくできました':'もう一度挑戦！';
  document.getElementById('result-icon').textContent = icons;
  document.getElementById('result-title').textContent = titles;
  document.getElementById('result-score').textContent = sessionPts+'pt';
  document.getElementById('result-sub').textContent = `${sessionCorrect}/${total}問正解`;
  document.getElementById('r-correct').textContent = sessionCorrect;
  document.getElementById('r-wrong').textContent = total-sessionCorrect;
  document.getElementById('r-rate').textContent = rate+'%';
  // 苦手がある場合はボタン表示
  const weak = loadWeak();
  const rwBtn = document.getElementById('result-weak-btn');
  if(weak.length > 0) {
    rwBtn.style.display = '';
    rwBtn.textContent = `🔥 苦手を特訓（${weak.length}問）`;
  } else {
    rwBtn.style.display = 'none';
  }
  showScreen('result');
}

function retryQuiz() {
  if(isWeakMode) {
    startWeak();
  } else {
    currentUnit = lastUnit;
    startQuiz(lastLevel);
  }
}

// ===== QUIT =====
function confirmQuit() {
  document.getElementById('quit-overlay').classList.add('active');
}
function cancelQuit() {
  document.getElementById('quit-overlay').classList.remove('active');
}
function doQuit() {
  document.getElementById('quit-overlay').classList.remove('active');
  showTop();
}

// ===== 初期化 =====
updateTopCounts();
(function initTopWeak(){
  const weak = loadWeak();
  const btn = document.getElementById('top-weak-btn');
  const cnt = document.getElementById('top-weak-count');
  if(weak.length > 0) {
    btn.classList.add('visible');
    cnt.textContent = `全体 ${weak.length}問 蓄積中`;
  } else {
    btn.classList.remove('visible');
  }
})();
</script>
